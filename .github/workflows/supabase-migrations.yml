name: Migrations Supabase

# Applique les fichiers de supabase/migrations/*.sql sur la base Supabase.
# Les migrations sont idempotentes : les rejouer ne casse rien.
#
# Déclenché à chaque push qui modifie une migration (ou ce workflow) sur la
# branche de développement ET sur la branche de production. Pousser d'abord
# sur la branche de développement applique la base AVANT que Vercel ne
# déploie le code qui en dépend (le déploiement Vercel part du push sur la
# branche de production).
#
# Secret requis (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_PASSWORD  le mot de passe de la base Supabase, tel quel (aucun
#                         encodage nécessaire, même avec des caractères spéciaux).
#   Le serveur (Session pooler) et l'utilisateur sont fixés plus bas : ils ne
#   sont pas secrets. (Alternative : SUPABASE_DB_URL, une URI Postgres complète
#   du Session pooler — le mot de passe doit alors être encodé dans l'URI.)

on:
  push:
    branches:
      - claude/new-session-2tinvq
      - claude/new-session-mg7695
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: aws-1-eu-west-1.pooler.supabase.com   # Session pooler du projet (non secret)
      PGPORT: '5432'
      PGUSER: postgres.ylbhmtujnhhrdywnztxo         # postgres.<référence du projet>
      PGDATABASE: postgres
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la connexion
        run: |
          if [ -n "$PGPASSWORD" ]; then
            echo "Connexion par SUPABASE_DB_PASSWORD (utilisateur $PGUSER)"
            echo 'CONN=' >> "$GITHUB_ENV"
          elif [ -n "$SUPABASE_DB_URL" ]; then
            echo "Connexion par SUPABASE_DB_URL"
            echo "CONN=$SUPABASE_DB_URL" >> "$GITHUB_ENV"
            echo "::add-mask::$SUPABASE_DB_URL"
          else
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant : Settings > Secrets and variables > Actions > New repository secret (mot de passe de la base Supabase)."
            exit 1
          fi

      - name: Appliquer les migrations
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql "$CONN" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
          done

      - name: Vérifier le résultat
        run: |
          psql "$CONN" -v ON_ERROR_STOP=1 -tA <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_proc where proname = 'submit_depot_order') then
              raise exception 'submit_depot_order absente';
            end if;
            if not exists (select 1 from storage.buckets where id = 'receipts' and public = false) then
              raise exception 'bucket receipts absent ou public';
            end if;
            if (select count(*) from information_schema.columns
                where table_name = 'depot_orders' and column_name in ('receipt_path', 'receipt_data')) <> 2 then
              raise exception 'colonnes receipt_path / receipt_data absentes';
            end if;
            raise notice 'Migration vérifiée : fonction, bucket privé et colonnes présents.';
          end $$;
          SQL
