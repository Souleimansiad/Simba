<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simba — Dépôt & Retrait 1xBet via Waafi</title>
<meta name="description" content="Simba : échange rapide et sécurisé entre Waafi et 1xBet. Dépôt et retrait en quelques minutes.">
<meta name="theme-color" content="#060B14">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F8FFF'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='800' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F8FFF'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='800' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-title:'Sora',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --primary:#2F8FFF; --primary-2:#6FB6FF;
  --success:#22C55E; --danger:#EF4444; --warning:#F59E0B;
}
html[data-theme="dark"]{
  --bg:#060B14; --bg-alt:#0A1220; --bg-elev:#0D1526;
  --card-bg:rgba(255,255,255,.045); --card-bg-solid:#0D1526;
  --card-border:rgba(255,255,255,.09);
  --text:#F5F8FF; --text-dim:#93A2BD; --text-faint:#5B6B87;
  --glow:0 0 44px rgba(47,143,255,.32);
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --input-bg:rgba(255,255,255,.04);
}
html[data-theme="light"]{
  --bg:#EAF3FF; --bg-alt:#F5F9FF; --bg-elev:#FFFFFF;
  --card-bg:rgba(255,255,255,.85); --card-bg-solid:#FFFFFF;
  --card-border:rgba(15,40,80,.09);
  --text:#0B1B33; --text-dim:#4A5872; --text-faint:#8593AC;
  --glow:0 0 44px rgba(47,143,255,.18);
  --shadow:0 20px 50px -22px rgba(20,50,100,.25);
  --input-bg:rgba(15,40,80,.035);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-title); font-weight:800; letter-spacing:-.01em;}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer;}
img,svg{display:block; max-width:100%;}
.container{max-width:1080px; margin:0 auto; padding:0 20px;}
.hidden{display:none !important;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* ============================= HEADER ============================= */
header.site{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  border-bottom:1px solid var(--card-border);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:1080px; margin:0 auto; gap:12px;}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--font-title); font-weight:800; font-size:1.25rem;}
.logo-mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--primary),#7CC4FF); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; box-shadow:var(--glow);}
.tagline-small{font-size:.72rem; color:var(--text-dim); font-weight:500; display:block; margin-top:-2px;}
.header-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--card-border);
  background:var(--card-bg); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:.95rem; transition:transform .15s ease, border-color .15s ease;
}
.icon-btn:hover{border-color:var(--primary);}
.icon-btn:active{transform:scale(.94);}
.status-pill{
  display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--text-dim);
  border:1px solid var(--card-border); border-radius:999px; padding:6px 10px; background:var(--card-bg);
}
.status-dot{width:8px; height:8px; border-radius:50%; background:var(--success); box-shadow:0 0 0 3px rgba(34,197,94,.18);}
@media (prefers-reduced-motion:no-preference){
  .status-dot{animation:pulse-dot 1.8s ease-in-out infinite;}
}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-s); border:1px solid transparent; padding:12px 20px;
  font-weight:700; font-size:.92rem; transition:transform .15s ease, box-shadow .2s ease, filter .15s ease;
  text-decoration:none; white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--primary),#63A9FF); color:#fff; box-shadow:0 10px 30px -8px rgba(47,143,255,.55);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:var(--card-bg); border-color:var(--card-border); color:var(--text);}
.btn-outline:hover{border-color:var(--primary);}
.btn-success{background:linear-gradient(135deg,#22C55E,#4ADE80); color:#06210F; box-shadow:0 10px 26px -10px rgba(34,197,94,.5);}
.btn-danger{background:linear-gradient(135deg,#EF4444,#F87171); color:#2A0808; box-shadow:0 10px 26px -10px rgba(239,68,68,.5);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:.8rem;}
.btn:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none;}

/* ============================= GLASS CARD ============================= */
.card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-l);
  backdrop-filter:blur(18px); box-shadow:var(--shadow); padding:26px;
}

/* ============================= HERO ============================= */
.hero{position:relative; overflow:hidden; padding:64px 0 40px;}
.hero-bg{position:absolute; inset:0; z-index:0; overflow:hidden;}
.orb{position:absolute; border-radius:50%; filter:blur(60px); opacity:.55;}
.orb-1{width:340px; height:340px; background:#2F8FFF; top:-120px; left:-80px;}
.orb-2{width:280px; height:280px; background:#7C4DFF; top:60px; right:-100px; opacity:.35;}
.orb-3{width:220px; height:220px; background:#22C55E; bottom:-100px; left:40%; opacity:.25;}
@media (prefers-reduced-motion:no-preference){
  .orb-1{animation:float-a 14s ease-in-out infinite;}
  .orb-2{animation:float-b 18s ease-in-out infinite;}
  .orb-3{animation:float-a 16s ease-in-out infinite reverse;}
}
@keyframes float-a{0%,100%{transform:translate(0,0);}50%{transform:translate(30px,40px);}}
@keyframes float-b{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,20px);}}
.hero-content{position:relative; z-index:1; text-align:center; max-width:680px; margin:0 auto;}
.eyebrow{display:inline-flex; align-items:center; gap:6px; background:var(--card-bg); border:1px solid var(--card-border); padding:6px 14px; border-radius:999px; font-size:.78rem; color:var(--primary-2); font-weight:600; margin-bottom:18px;}
.hero h1{font-size:clamp(2rem,5vw,3.1rem); line-height:1.08; margin-bottom:14px;}
.hero h1 span{background:linear-gradient(135deg,var(--primary),#8FD3FF); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p.sub{color:var(--text-dim); font-size:1.05rem; margin-bottom:22px;}
.promo-row{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:26px;}
.promo-code{
  display:flex; align-items:center; gap:8px; background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:999px; padding:6px 6px 6px 16px; box-shadow:var(--shadow);
}
.promo-code .promo-label{font-size:.82rem; color:var(--text-dim); font-weight:500; white-space:nowrap;}
.promo-code .promo-value{
  font-family:var(--font-mono); font-weight:700; color:#fff; background:linear-gradient(135deg,var(--primary),#63A9FF);
  padding:6px 14px; border-radius:999px; font-size:.85rem; letter-spacing:.02em; box-shadow:0 4px 14px -4px rgba(47,143,255,.55);
}
.promo-code button{
  background:none; border:none; color:var(--text-dim); width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; transition:color .15s ease, background .15s ease;
}
.promo-code button:hover{color:var(--primary); background:rgba(47,143,255,.1);}
.promo-code button svg{vertical-align:middle !important;}

/* ============================= ACTION CARD (depot/retrait) ============================= */
.action-card{max-width:640px; margin:0 auto; padding:22px;}
.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
@media (max-width:420px){.action-grid{gap:8px;}}
.action-tile{
  display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:22px;
  border-radius:var(--radius-m); border:1.5px solid var(--card-border); text-decoration:none; color:var(--text);
  background:var(--card-bg); transition:transform .15s ease, border-color .15s ease, box-shadow .2s ease;
  min-width:0;
}
@media (max-width:420px){.action-tile{padding:16px 14px; gap:8px;}}
.action-tile.tile-depot{border-color:rgba(34,197,94,.5);}
.action-tile.tile-retrait{border-color:rgba(47,143,255,.5);}
.action-tile:hover{transform:translateY(-3px); box-shadow:0 16px 34px -18px rgba(0,0,0,.5);}
.tile-icon{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.tile-depot .tile-icon{background:linear-gradient(135deg,rgba(34,197,94,.22),rgba(34,197,94,.08)); color:var(--success);}
.tile-retrait .tile-icon{background:linear-gradient(135deg,rgba(47,143,255,.22),rgba(47,143,255,.08)); color:var(--primary);}
.tile-title{font-family:var(--font-title); font-weight:700; font-size:1.05rem;}
.tile-desc{font-size:.82rem; color:var(--text-dim); line-height:1.35;}
@media (max-width:420px){
  .tile-icon{width:38px; height:38px; border-radius:11px;}
  .tile-title{font-size:.92rem;}
  .tile-desc{font-size:.74rem;}
}

/* ============================= SECTIONS ============================= */
section{padding:44px 0;}
.section-title{text-align:center; margin-bottom:28px;}
.section-title h2{font-size:1.7rem; margin-bottom:8px;}
.section-title p{color:var(--text-dim);}

/* FAQ */
.faq-item{border:1px solid var(--card-border); border-radius:var(--radius-m); margin-bottom:10px; overflow:hidden; background:var(--card-bg);}
.faq-q{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; font-weight:700; background:none; border:none; color:var(--text); width:100%; text-align:left; font-size:.95rem;}
.faq-a{padding:0 18px; max-height:0; overflow:hidden; color:var(--text-dim); font-size:.88rem; transition:max-height .25s ease, padding .25s ease;}
.faq-item.open .faq-a{padding:0 18px 16px; max-height:240px;}
.faq-item.open .faq-q .chev{transform:rotate(180deg);}
.chev{transition:transform .2s ease;}

/* Support / footer */
.support-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
footer.site{border-top:1px solid var(--card-border); padding:28px 0; text-align:center; color:var(--text-faint); font-size:.8rem;}

/* ============================= FORM PAGES ============================= */
.page-header{display:flex; align-items:center; gap:14px; padding:18px 0 6px;}
.back-btn{width:38px; height:38px; border-radius:10px; background:var(--card-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); font-size:1.1rem;}
.page-header h1{font-size:1.4rem;}
.form-page{max-width:560px; margin:0 auto; padding-bottom:60px;}
.info-box{display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:18px;}
.info-box .label{font-size:.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
.info-box .value{font-family:var(--font-mono); font-weight:700; font-size:1.15rem; color:var(--primary-2);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:.82rem; font-weight:600; margin-bottom:6px; color:var(--text-dim);}
.field .hint{font-size:.72rem; color:var(--text-faint); margin-top:5px;}
.field input,.field select{
  width:100%; padding:13px 14px; border-radius:var(--radius-s); border:1.5px solid var(--card-border);
  background:var(--input-bg); color:var(--text); font-size:.95rem; font-family:var(--font-body);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input.mono-input{font-family:var(--font-mono);}
.field input:focus,.field select:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,143,255,.15);}
.field input.invalid{border-color:var(--danger);}
.phone-input{display:flex; border-radius:var(--radius-s); border:1.5px solid var(--card-border); background:var(--input-bg); overflow:hidden; transition:border-color .15s ease, box-shadow .15s ease;}
.phone-input:focus-within{border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,143,255,.15);}
.phone-input .phone-prefix{display:flex; align-items:center; padding:0 12px; color:var(--text-dim); font-family:var(--font-mono); font-size:.95rem; background:rgba(148,163,184,.08); border-right:1.5px solid var(--card-border); white-space:nowrap;}
.phone-input input{border:none; background:transparent; flex:1; min-width:0; padding:13px 14px; color:var(--text); font-size:.95rem; font-family:var(--font-mono);}
.phone-input input:focus{outline:none; box-shadow:none;}
.steps{list-style:none; counter-reset:step; margin-bottom:20px;}
.steps li{counter-increment:step; display:flex; gap:12px; padding:10px 0; font-size:.9rem; color:var(--text-dim);}
.steps li::before{content:counter(step); flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700;}
.captcha-row{display:flex; align-items:center; gap:10px;}
.captcha-question{
  background:var(--input-bg); border:1.5px solid var(--card-border); border-radius:var(--radius-s);
  padding:13px 16px; font-weight:700; font-size:1rem; color:var(--text); white-space:nowrap;
}
.captcha-input{max-width:110px;}

/* ============================= SUIVI / TIMELINE ============================= */
.suivi-card{max-width:560px; margin:40px auto; text-align:center;}
.suivi-id{font-family:var(--font-mono); font-size:1.4rem; font-weight:700; color:var(--primary-2); margin-bottom:6px;}
.suivi-details{margin-top:26px; text-align:left; border-top:1px solid var(--border); padding-top:18px; display:flex; flex-direction:column; gap:10px;}
.suivi-detail-row{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.suivi-detail-label{color:var(--text-dim); font-size:.85rem;}
.suivi-detail-value{font-size:.85rem; word-break:break-all; text-align:right;}
.timeline{list-style:none; text-align:left; margin-top:26px;}
.timeline li{display:flex; gap:14px; padding-bottom:26px; position:relative;}
.timeline li:not(:last-child)::before{content:''; position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--card-border);}
.t-dot{flex:0 0 auto; width:28px; height:28px; border-radius:50%; border:2px solid var(--card-border); display:flex; align-items:center; justify-content:center; background:var(--bg-elev); font-size:.75rem;}
.timeline li.done .t-dot{border-color:var(--success); background:var(--success); color:#06210F;}
.timeline li.active .t-dot{border-color:var(--primary); box-shadow:0 0 0 4px rgba(47,143,255,.2);}
.timeline li.failed .t-dot{border-color:var(--danger); background:var(--danger); color:#fff;}
.t-dot-pulse{width:8px; height:8px; border-radius:50%; background:var(--primary);}
.suivi-state-icon{color:var(--primary-2); margin-bottom:10px;}
.suivi-state-icon.success{color:var(--success);}
.suivi-state-icon.failed{color:var(--danger);}
.suivi-progress-label{font-size:.78rem; color:var(--text-dim); margin-top:18px; margin-bottom:6px; text-align:left;}
.suivi-progress-bar{height:6px; border-radius:3px; background:var(--card-border); overflow:hidden;}
.suivi-progress-fill{height:100%; background:var(--primary); transition:width .3s;}
.suivi-progress-fill.success{background:var(--success);}
.suivi-progress-fill.failed{background:var(--danger);}
.suivi-submsg{margin-top:10px; font-size:.85rem; color:var(--text-dim); text-align:left;}
.suivi-submsg.failed{color:var(--danger);}
.suivi-reason{margin-top:6px; font-size:.85rem; text-align:left; padding:10px 12px; border-radius:10px; background:rgba(239,68,68,.1); color:var(--danger);}
.suivi-actions{margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;}
@media (prefers-reduced-motion:no-preference){
  .t-dot-pulse{animation:pulse-dot 1.4s ease-in-out infinite;}
}
.t-title{font-weight:700; font-size:.92rem;}
.t-sub{font-size:.78rem; color:var(--text-dim);}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:.72rem; font-weight:700;}
.badge-en_attente{background:rgba(245,158,11,.15); color:var(--warning);}
.badge-paiement_recu{background:rgba(47,143,255,.15); color:var(--primary-2);}
.badge-credite{background:rgba(34,197,94,.15); color:var(--success);}
.badge-rejete{background:rgba(148,163,184,.18); color:var(--text-dim);}
.badge-fraude{background:rgba(239,68,68,.16); color:var(--danger);}
.badge-annule{background:rgba(148,163,184,.18); color:var(--text-dim);}

/* ============================= LOGIN ============================= */
.auth-wrap{min-height:calc(100vh - 70px); display:flex; align-items:center; justify-content:center; padding:40px 20px;}
.auth-card{width:100%; max-width:400px; padding:30px;}
.auth-card h2{text-align:center; margin-bottom:4px;}
.auth-card .sub{text-align:center; color:var(--text-dim); font-size:.85rem; margin-bottom:22px;}
.divider{display:flex; align-items:center; gap:10px; color:var(--text-faint); font-size:.75rem; margin:16px 0;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--card-border);}

/* ============================= ADMIN ============================= */
.admin-shell{display:flex; min-height:calc(100vh - 70px);}
.admin-side{width:220px; flex:0 0 auto; border-right:1px solid var(--card-border); padding:18px 10px; background:var(--bg-alt);}
.admin-nav-btn{display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; border-radius:var(--radius-s); background:none; border:none; color:var(--text-dim); font-weight:600; font-size:.88rem; margin-bottom:4px; text-align:left;}
.admin-nav-btn.active{background:var(--card-bg); color:var(--primary-2);}
.admin-nav-btn:hover{color:var(--text);}
.admin-main{flex:1; padding:24px; overflow-x:auto;}
@media (max-width:800px){.admin-shell{flex-direction:column;} .admin-side{width:100%; display:flex; overflow-x:auto; gap:6px; border-right:none; border-bottom:1px solid var(--card-border);} .admin-nav-btn{white-space:nowrap;}}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{padding:18px;}
.stat-card .label{font-size:.75rem; color:var(--text-dim); margin-bottom:6px;}
.stat-card .value{font-family:var(--font-mono); font-size:1.5rem; font-weight:700;}
.chart-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-bottom:24px;}
.chart-card{padding:18px; height:280px;}
.chart-card canvas{max-height:220px;}
.filter-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.chip{padding:7px 14px; border-radius:999px; font-size:.78rem; font-weight:600; border:1px solid var(--card-border); background:var(--card-bg); color:var(--text-dim);}
.chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
table.data-table{width:100%; border-collapse:collapse; font-size:.85rem;}
table.data-table th{text-align:left; padding:10px 12px; color:var(--text-faint); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--card-border);}
table.data-table td{padding:12px; border-bottom:1px solid var(--card-border); vertical-align:middle;}
table.data-table tr.flash-new{animation:flashRow 1.6s ease;}

/* Toasts */
#toast-root{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{padding:13px 18px; border-radius:var(--radius-s); background:var(--card-bg-solid); border:1px solid var(--card-border); box-shadow:var(--shadow); font-size:.85rem; font-weight:600; max-width:320px;}
.toast.success{border-color:var(--success); color:var(--success);}
.toast.error{border-color:var(--danger); color:var(--danger);}
.toast.info{border-color:var(--primary); color:var(--primary-2);}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:toast-in .25s ease;}
}
@keyframes toast-in{from{transform:translateX(20px); opacity:0;}to{transform:translateX(0); opacity:1;}}

.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; display:inline-block;}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin .7s linear infinite;}}
@keyframes spin{to{transform:rotate(360deg);}}

function checkCreatorBypass(){
  const params = new URLSearchParams(location.search);
  const kp = params.get('kp');
  if (kp && CONFIG.ADMIN_URL_TOKEN !== 'REPLACE_WITH_RANDOM_TOKEN' && kp === CONFIG.ADMIN_URL_TOKEN){
    sessionStorage.setItem('simba_kp', '1');
  }
  state.isCreatorBypass = sessionStorage.getItem('simba_kp') === '1';
}

function computeEffectiveRole(){
  if (state.isCreatorBypass) { state.effectiveRole = 'createur'; return; }
  state.effectiveRole = state.agent ? state.agent.role : null;
}

/* API fetch helper : joint le JWT Supabase et/ou le token créateur */
async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.session && state.session.access_token) headers['Authorization'] = 'Bearer ' + state.session.access_token;
  if (state.isCreatorBypass) headers['x-admin-token'] = CONFIG.ADMIN_URL_TOKEN;
  const res = await fetch('/api/' + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur API (' + res.status + ')'));
  return data;
}

/* ------------------------------ ROUTER ------------------------------- */
function route(){
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  teardownRealtime();

  if (hash.startsWith('#suivi-')) { renderSuivi(app, hash.slice(7)); return; }
  if (hash === '#depot') { renderDepot(app); return; }
  if (hash === '#retrait') { renderRetrait(app); return; }
  if (hash === '#login') { renderLogin(app); return; }
  if (hash === '#admin') {
    if (!state.effectiveRole) { renderLogin(app); return; }
    renderAdmin(app); return;
  }
  renderHome(app);
}
window.addEventListener('hashchange', route);

function teardownRealtime(){
  if (state.ordersRealtimeChannel){ sb.removeChannel(state.ordersRealtimeChannel); state.ordersRealtimeChannel = null; }
  if (state.suiviChannel){ sb.removeChannel(state.suiviChannel); state.suiviChannel = null; }
}

function captchaHtml(id){
  return `
    <div class="field">
      <label>${t('form.captcha_label')}</label>
      <div class="captcha-row">
        <span class="captcha-question mono" id="${id}-question"></span>
        <input type="number" inputmode="numeric" class="mono-input captcha-input" id="${id}-input" placeholder="?" required>
      </div>
    </div>
  `;
}
function mountCaptcha(id){
  const a = Math.floor(Math.random() * 9) + 1;
  const b = Math.floor(Math.random() * 9) + 1;
  document.getElementById(id + '-question').textContent = `${a} + ${b} = `;
  const answer = a + b;
  return () => Number(document.getElementById(id + '-input').value) === answer;
}

// Les IDs (DDMMYYYY-XXX) ne portent plus de lettre de type : on tente
// dépôt puis retrait via get_order_status (RPC publique, sans exposer les
// tables complètes).
async function fetchOrderStatus(orderId){
  let { data } = await sb.rpc('get_order_status', { p_order_id: orderId, p_type: 'depot' });
  if (data && data.length) return data[0];
  ({ data } = await sb.rpc('get_order_status', { p_order_id: orderId, p_type: 'retrait' }));
  if (data && data.length) return data[0];
  return null;
}

function timelineHtml(status){
  const steps = [
    { key:'en_attente', label:t('suivi.status.en_attente') },
    { key:'paiement_recu', label:t('suivi.status.paiement_recu') },
    { key:'credite', label:t('suivi.status.credite') },
  ];
  const failed = status === 'rejete' || status === 'fraude' || status === 'annule';
  const order = ['en_attente','paiement_recu','credite'];
  const curIdx = order.indexOf(status);
  return `<ul class="timeline">` + steps.map((s, i) => {
    let cls = '';
    if (!failed){
      if (i < curIdx) cls = 'done'; else if (i === curIdx) cls = 'active';
    } else {
      if (i < 1) cls = 'done';
    }
    const dotIcon = cls === 'done' ? icon('check', 14) : (cls === 'active' ? '<span class="t-dot-pulse"></span>' : '');
    return `<li class="${cls}"><div class="t-dot">${dotIcon}</div><div><div class="t-title">${s.label}</div></div></li>`;
  }).join('') + (failed ? `
    <li class="failed"><div class="t-dot">${icon('x', 14)}</div><div><div class="t-title">${t('suivi.status.' + status)}</div></div></li>
  ` : '') + `</ul>`;
}

// État visuel principal (icône + titre + étape courante) pour chaque statut.
function suiviStateVisual(order){
  const status = order.status;
  if (status === 'en_attente') {
    return { icon: icon('clock', 40), iconClass:'', title: t('suivi.step1.title'), step: 1, fillClass:'' };
  }
  if (status === 'paiement_recu') {
    if (order.mobcash_status === 'echec_permanent') {
      return { icon: icon('alert', 40), iconClass:'failed', title: t('suivi.step2.title'), step: 2, fillClass:'failed' };
    }
    return { icon: '<span class="spinner" style="width:36px;height:36px;border-width:3px;"></span>', iconClass:'', title: t('suivi.step2.title'), step: 2, fillClass:'' };
  }
  if (status === 'credite') {
    return { icon: icon('check', 40), iconClass:'success', title: t('suivi.step3.success'), step: 3, fillClass:'success' };
  }
  return {
    icon: icon('x', 40), iconClass:'failed',
    title: status === 'annule' ? t('suivi.status.annule') : t('suivi.step3.failed'),
    step: 3, fillClass:'failed',
  };
}

function renderSuivi(app, orderId){
  let currentType = null; // détecté au premier chargement
  app.innerHTML = `
    ${headerHtml(true, '#/')}
    <div class="container">
      <div class="card suivi-card" id="suivi-content">
        <div class="spinner" style="width:28px;height:28px;border-width:3px;margin:0 auto;"></div>
      </div>
    </div>
  `;
  bindHeaderEvents();

  async function load(){
    const order = await fetchOrderStatus(orderId);
    const content = document.getElementById('suivi-content');
    if (!order){
      content.innerHTML = `<p>${t('suivi.not_found')}</p>`;
      return;
    }
    currentType = order.type;
    renderOrderStatus(content, order);
  }

  async function cancelOrder(){
    if (!confirm(t('suivi.cancel_confirm'))) return;
    const { error } = await sb.rpc('cancel_order', { p_order_id: orderId, p_type: currentType });
    if (error) { toast(error.message, 'error'); return; }
    toast(t('suivi.cancelled_ok'), 'success');
    load();
  }

  function renderOrderStatus(content, order){
    const isDepot = order.type === 'depot';
    const rows = [
      [t('suivi.detail.bet_id'), order.id_bet1x],
      [isDepot ? t('suivi.detail.waafi_depot') : t('suivi.detail.waafi_retrait'), order.waafi_number],
      [isDepot ? t('suivi.detail.ref_depot') : t('suivi.detail.ref_retrait'), order.reference],
      order.whatsapp ? [t('suivi.detail.whatsapp'), order.whatsapp] : null,
      [t('suivi.detail.created'), new Date(order.created_at).toLocaleString()],
      [t('suivi.detail.updated'), new Date(order.updated_at).toLocaleString()],
    ].filter(Boolean);

    const visual = suiviStateVisual(order);
    const showFailureBlock = (order.status === 'rejete' || order.status === 'fraude' || order.status === 'annule')
      || (order.status === 'paiement_recu' && order.mobcash_status === 'echec_permanent');
    const showCancel = order.status === 'en_attente';

    content.innerHTML = `
      <div class="suivi-state-icon ${visual.iconClass}">${visual.icon}</div>
      <h2>${visual.title}</h2>
      <div class="suivi-id mono">#${order.id}</div>
      <div class="badge badge-${order.status}">${t('suivi.status.' + order.status)}</div>
      <div style="margin-top:14px;color:var(--text-dim);font-family:var(--font-mono);">${Number(order.montant).toLocaleString()} DJF</div>

      <div class="suivi-progress-label">${t('suivi.progress')} ${visual.step}/3</div>
      <div class="suivi-progress-bar"><div class="suivi-progress-fill ${visual.fillClass}" style="width:${(visual.step/3*100)}%"></div></div>

      ${showFailureBlock && order.last_error ? `<div class="suivi-reason"><strong>${t('suivi.reason')}:</strong> ${/payerNickname/i.test(order.last_error) ? t('suivi.invalid_account') : order.last_error}</div>` : ''}

      ${timelineHtml(order.status)}

      <div class="suivi-details">
        ${rows.map(([label, value]) => `
          <div class="suivi-detail-row">
            <span class="suivi-detail-label">${label}</span>
            <span class="suivi-detail-value mono">${value}</span>
          </div>
        `).join('')}
      </div>

      ${showCancel || showFailureBlock ? `
        <div class="suivi-actions">
          ${showCancel ? `<button class="btn btn-outline" id="suivi-cancel-btn">${icon('x', 16)} ${t('suivi.cancel')}</button>` : ''}
          ${showFailureBlock ? `
            <a class="btn btn-outline" href="${CONFIG.WHATSAPP_SUPPORT_URL}" target="_blank" rel="noopener">${icon('message', 16)} WhatsApp</a>
            <a class="btn btn-outline" href="${CONFIG.TELEGRAM_SUPPORT_URL}" target="_blank" rel="noopener">${icon('send', 16)} Telegram</a>
          ` : ''}
        </div>
      ` : ''}
    `;

    if (showCancel) document.getElementById('suivi-cancel-btn').addEventListener('click', cancelOrder);
  }
  load();

  // Broadcast from Database : suivi public en temps réel, sans exposer la table complète.
  state.suiviChannel = sb.channel('order-updates:' + orderId, { config: { private: true } })
    .on('broadcast', { event: '*' }, () => load())
    .subscribe();
}

/* ------------------------------ AUTH STATE ------------------------------ */
async function refreshAuthState(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if (session && session.user){
    const { data: agentRow } = await sb.from('agents').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
    state.agent = agentRow || null;
  } else {
    state.agent = null;
  }
  computeEffectiveRole();
}
sb.auth.onAuthStateChange(async (_event, session) => {
  state.session = session;
  if (session && session.user){
    const { data: agentRow } = await sb.from('agents').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
    state.agent = agentRow || null;
  } else {
    state.agent = null;
  }
  computeEffectiveRole();
});

/* ------------------------------ ADMIN PANEL ------------------------------ */
const ADMIN_TABS = [
  { key:'dashboard', icon:'barChart', roles:['createur','admin','agent_paiement','support','observateur'] },
  { key:'orders', icon:'fileText', roles:['createur','admin','agent_paiement','support','observateur'] },
  { key:'reserves', icon:'wallet', roles:['createur','admin'] },
  { key:'agents', icon:'users', roles:['createur','admin'] },
  { key:'notifications', icon:'bell', roles:['createur','admin','support'] },
  { key:'testpay', icon:'flask', roles:['createur','admin'] },
  { key:'testwa', icon:'message', roles:['createur','admin'] },
];

function renderAdmin(app){
  const visibleTabs = ADMIN_TABS.filter(tab => tab.roles.includes(state.effectiveRole));
  if (!visibleTabs.find(t2 => t2.key === state.adminTab)) state.adminTab = visibleTabs[0].key;

  app.innerHTML = `
    ${headerHtml(true, '#/')}
    <div class="admin-shell">
      <aside class="admin-side">
        ${visibleTabs.map(tabDef => `
          <button class="admin-nav-btn ${state.adminTab === tabDef.key ? 'active' : ''}" data-tab="${tabDef.key}">
            ${icon(tabDef.icon, 16)} ${t('admin.' + tabDef.key)}
          </button>
        `).join('')}
        <button class="admin-nav-btn" id="admin-logout">${icon('logout', 16)} ${t('admin.logout')}</button>
      </aside>
      <main class="admin-main" id="admin-main"></main>
    </div>
  `;
  bindHeaderEvents();
  app.querySelectorAll('.admin-nav-btn[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { state.adminTab = btn.dataset.tab; renderAdmin(app); });
  });
  document.getElementById('admin-logout').addEventListener('click', async () => {
    await sb.auth.signOut();
    sessionStorage.removeItem('simba_kp');
    state.isCreatorBypass = false; state.agent = null; state.effectiveRole = null;
    location.hash = '#/';
  });

  const main = document.getElementById('admin-main');
  if (state.adminTab === 'dashboard') renderAdminDashboard(main);
  else if (state.adminTab === 'orders') renderAdminOrders(main);
  else if (state.adminTab === 'reserves') renderAdminReserves(main);
  else if (state.adminTab === 'agents') renderAdminAgents(main);
  else if (state.adminTab === 'notifications') renderAdminNotifications(main);
  else if (state.adminTab === 'testpay') renderAdminTestPay(main);
  else if (state.adminTab === 'testwa') renderAdminTestWa(main);
}

/* --- Dashboard --- */
function renderAdminDashboard(main){
  main.innerHTML = `
    <div class="filter-chips" id="range-chips">
      ${['today','yesterday','7d','30d','all'].map(r => `<button class="chip ${r==='today'?'active':''}" data-range="${r}">${({today:"Aujourd'hui",yesterday:'Hier','7d':'7j','30d':'30j',all:'Tout'})[r]}</button>`).join('')}
    </div>
    <div class="stat-grid" id="stat-grid"><div class="card stat-card">…</div></div>
    <div class="chart-grid">
      <div class="card chart-card"><h4 style="margin-bottom:10px;font-size:.85rem;color:var(--text-dim);">Volume / heure</h4><canvas id="chart-volume"></canvas></div>
      <div class="card chart-card"><h4 style="margin-bottom:10px;font-size:.85rem;color:var(--text-dim);">Bénéfice</h4><canvas id="chart-profit"></canvas></div>
      <div class="card chart-card"><h4 style="margin-bottom:10px;font-size:.85rem;color:var(--text-dim);">Dépôts / Retraits</h4><canvas id="chart-split"></canvas></div>
    </div>
  `;
  let charts = {};
  async function load(range){
    try {
      const stats = await apiFetch('admin?action=stats&range=' + range);
      const statGrid = document.getElementById('stat-grid');
      statGrid.innerHTML = `
        <div class="card stat-card"><div class="label">Total ordres</div><div class="value">${stats.totals.orders}</div></div>
        <div class="card stat-card"><div class="label">Dépôts</div><div class="value">${stats.totals.depots}</div></div>
        <div class="card stat-card"><div class="label">Retraits</div><div class="value">${stats.totals.retraits}</div></div>
        <div class="card stat-card"><div class="label">Volume DJF</div><div class="value">${Number(stats.totals.volume||0).toLocaleString()}</div></div>
        ${state.effectiveRole === 'createur' ? `<div class="card stat-card"><div class="label">Bénéfice</div><div class="value" style="color:var(--success);">${Number(stats.totals.profit||0).toLocaleString()}</div></div>` : ''}
      `;
      Object.values(charts).forEach(c => c.destroy());
      const ctxVol = document.getElementById('chart-volume');
      charts.volume = new Chart(ctxVol, { type:'bar', data:{ labels: (stats.byHour||[]).map(h=>h.hour), datasets:[{ label:'Volume', data:(stats.byHour||[]).map(h=>h.volume), backgroundColor:'#2F8FFF' }] }, options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false } });
      const ctxProfit = document.getElementById('chart-profit');
      charts.profit = new Chart(ctxProfit, { type:'line', data:{ labels:(stats.profitByDay||[]).map(p=>p.day), datasets:[{ label:'Bénéfice', data:(stats.profitByDay||[]).map(p=>p.profit), borderColor:'#22C55E', tension:.35 }] }, options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false } });
      const ctxSplit = document.getElementById('chart-split');
      charts.split = new Chart(ctxSplit, { type:'doughnut', data:{ labels:['Dépôts','Retraits'], datasets:[{ data:[stats.totals.depots, stats.totals.retraits], backgroundColor:['#22C55E','#2F8FFF'] }] }, options:{ responsive:true, maintainAspectRatio:false } });
    } catch (err) { toast(err.message, 'error'); }
  }
  document.querySelectorAll('#range-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#range-chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      load(chip.dataset.range);
    });
  });
  load('today');
}

/* --- Orders --- */
const STALE_MS = 30 * 60 * 1000;

function renderAdminOrders(main){
  main.innerHTML = `
    <div class="filter-chips" id="order-chips">
      ${['tous','en_attente','depots','retraits','credite','rejete','fraude','annule'].map(f => `<button class="chip ${f==='tous'?'active':''}" data-filter="${f}">${f}</button>`).join('')}
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="data-table" id="orders-table">
        <thead><tr><th></th><th>ID</th><th>Type</th><th>Statut</th><th>Montant</th><th>ID 1xBet</th><th>Créé</th><th></th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  `;
  if (!state.session){
    document.getElementById('orders-tbody').innerHTML = `<tr><td colspan="8"><div class="empty-state">Connectez-vous avec un compte Supabase Auth pour voir les ordres en temps réel.</div></td></tr>`;
    return;
  }

  let allOrders = [];
  let currentFilter = 'tous';
  const expanded = new Set();

  function passesFilter(o){
    if (currentFilter === 'tous') return true;
    if (currentFilter === 'depots') return o.type === 'depot';
    if (currentFilter === 'retraits') return o.type === 'retrait';
    return o.status === currentFilter;
  }

  function copyBtn(value){
    return `<button class="btn-copy" data-copy="${String(value).replace(/"/g,'&quot;')}" title="Copier">${icon('copy', 13)}</button>`;
  }

  function detailRowHtml(o){
    const isDepot = o.type === 'depot';
    const rows = [
      ['ID', o.id],
      ['ID 1xBet', o.id_bet1x],
      [isDepot ? 'N° Waafi expéditeur' : 'N° Waafi réception', isDepot ? o.numero_waafi_expediteur : o.numero_waafi_reception],
      [isDepot ? 'Transfer ID' : 'Code retrait 1xBet', isDepot ? (o.transfer_id || '—') : o.code_retrait_1x],
      ['WhatsApp', o.whatsapp || '—'],
      ['Score fraude', o.fraud_score],
      ['Statut MobCash', o.mobcash_status || '—'],
      ['Tentatives MobCash', o.mobcash_attempts || 0],
      ['Dernière erreur', o.last_error || '—'],
      ['Créé le', new Date(o.created_at).toLocaleString()],
      ['Mis à jour le', new Date(o.updated_at).toLocaleString()],
    ];
    const retryPanel = (isDepot && o.status === 'paiement_recu' && o.mobcash_status === 'echec_permanent') ? `
      <div class="field" style="margin-top:10px;max-width:320px;">
        <label>Nouvel ID 1xBet (optionnel) puis relancer</label>
        <div style="display:flex;gap:8px;">
          <input type="text" class="mono-input" id="new-bet-id-${o.id}" placeholder="${o.id_bet1x}">
          <button class="btn btn-sm btn-success" data-retry-id="${o.id}">${icon('bolt', 14)} Relancer</button>
        </div>
      </div>
    ` : '';
    return `
      <tr class="detail-row"><td colspan="8">
        <div class="suivi-details" style="margin-top:0;border-top:none;">
          ${rows.map(([label, value]) => `
            <div class="suivi-detail-row">
              <span class="suivi-detail-label">${label}</span>
              <span class="suivi-detail-value mono">${value} ${copyBtn(value)}</span>
            </div>
          `).join('')}
        </div>
        ${retryPanel}
      </td></tr>
    `;
  }

  function renderRows(newId){
    const tbody = document.getElementById('orders-tbody');
    const rows = allOrders.filter(passesFilter).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if (rows.length === 0){ tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">Aucun ordre</div></td></tr>`; return; }
    tbody.innerHTML = rows.map(o => {
      const isStale = (o.status === 'en_attente' || o.status === 'paiement_recu') && (Date.now() - new Date(o.created_at).getTime() > STALE_MS);
      const isFraudy = o.status === 'fraude' || Number(o.fraud_score) > 0;
      return `
      <tr class="${o.id === newId ? 'flash-new' : ''}">
        <td><button class="btn-expand" data-expand="${o.id}">${expanded.has(o.id) ? icon('arrowUp', 14) : icon('arrowDown', 14)}</button></td>
        <td class="mono">${o.id}</td>
        <td>${o.type}</td>
        <td><span class="badge badge-${o.status}">${o.status}</span> ${isStale ? '⏰' : ''} ${isFraudy ? '🚨' : ''}</td>
        <td class="mono">${Number(o.montant).toLocaleString()}</td>
        <td class="mono">${o.id_bet1x || ''}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
        <td class="row-actions">
          ${o.status === 'en_attente' || o.status === 'paiement_recu' ? `
            <button class="btn btn-sm btn-success" data-act="confirmer" data-id="${o.id}" data-type="${o.type}">${icon('check', 14)}</button>
            <button class="btn btn-sm btn-danger" data-act="rejeter" data-id="${o.id}" data-type="${o.type}">${icon('x', 14)}</button>
            <button class="btn btn-sm btn-outline" data-act="fraude" data-id="${o.id}" data-type="${o.type}">${icon('alert', 14)}</button>
          ` : ''}
        </td>
      </tr>
      ${expanded.has(o.id) ? detailRowHtml(o) : ''}
    `;
    }).join('');

    tbody.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        let reason = null;
        if (btn.dataset.act === 'rejeter') {
          reason = prompt('Raison du rejet (optionnel) :') || '';
        }
        btn.disabled = true;
        try {
          await apiFetch('admin?action=action-ordre', { method:'POST', body:{ order_id: btn.dataset.id, type: btn.dataset.type, action: btn.dataset.act, reason } });
          toast('Action appliquée', 'success');
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      });
    });
    tbody.querySelectorAll('button[data-expand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.expand;
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderRows();
      });
    });
    tbody.querySelectorAll('button[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.copy).then(() => toast('Copié', 'success'));
      });
    });
    tbody.querySelectorAll('button[data-retry-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const orderId = btn.dataset.retryId;
        const newId = document.getElementById('new-bet-id-' + orderId).value.trim();
        btn.disabled = true;
        try {
          await apiFetch('admin?action=retry-deposit', { method:'POST', body:{ order_id: orderId, new_id_bet1x: newId || undefined } });
          toast('Relance effectuée', 'success');
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      });
    });
  }

  function beep(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.value = .06;
      osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 180);
    } catch (e) {}
  }

  async function loadAll(){
    const [{ data: depots }, { data: retraits }] = await Promise.all([
      sb.from('depot_orders').select('*').order('created_at', { ascending:false }).limit(200),
      sb.from('retrait_orders').select('*').order('created_at', { ascending:false }).limit(200),
    ]);
    allOrders = [
      ...(depots || []).map(o => Object.assign({}, o, { type:'depot' })),
      ...(retraits || []).map(o => Object.assign({}, o, { type:'retrait' })),
    ];
    renderRows();
  }

  document.querySelectorAll('#order-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#order-chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderRows();
    });
  });

  loadAll();

  state.ordersRealtimeChannel = sb.channel('admin-orders')
    .on('postgres_changes', { event:'*', schema:'public', table:'depot_orders' }, (payload) => {
      upsertOrder(payload, 'depot');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'retrait_orders' }, (payload) => {
      upsertOrder(payload, 'retrait');
    })
    .subscribe();

  function upsertOrder(payload, type){
    const row = Object.assign({}, payload.new || payload.old, { type });
    const idx = allOrders.findIndex(o => o.id === row.id && o.type === type);
    const isNew = payload.eventType === 'INSERT';
    if (idx >= 0) allOrders[idx] = row; else allOrders.unshift(row);
    renderRows(isNew ? row.id : null);
    if (isNew) beep();
  }
}

/* --- Reserves --- */
function renderAdminReserves(main){
  main.innerHTML = `<div class="card" style="max-width:420px;"><div id="reserves-form">Chargement…</div></div>`;
  sb.from('config_reserves').select('*').eq('id', 1).maybeSingle().then(({ data, error }) => {
    const el = document.getElementById('reserves-form');
    if (error || !data){ el.innerHTML = `<div class="empty-state">Erreur de chargement</div>`; return; }
    el.innerHTML = `
      <div class="field"><label>Réserve 1xBet</label><input type="number" id="res-xbet" class="mono-input" value="${data.xbet}"></div>
      <div class="field"><label>Réserve Waafi</label><input type="number" id="res-waafi" class="mono-input" value="${data.waafi}"></div>
      <button class="btn btn-primary btn-block" id="res-save">Enregistrer</button>
    `;
    document.getElementById('res-save').addEventListener('click', async () => {
      const xbet = Number(document.getElementById('res-xbet').value);
      const waafi = Number(document.getElementById('res-waafi').value);
      const { error: upErr } = await sb.from('config_reserves').update({ xbet, waafi, updated_by: state.agent ? state.agent.email : 'createur' }).eq('id', 1);
      if (upErr) toast(upErr.message, 'error'); else toast('Réserves mises à jour', 'success');
    });
  });
}

/* --- Agents --- */
function renderAdminAgents(main){
  main.innerHTML = `
    <form class="card form-inline" id="agent-form" style="margin-bottom:20px;">
      <div class="field"><label>Nom</label><input type="text" id="a-name" required></div>
      <div class="field"><label>Email</label><input type="email" id="a-email" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="a-password" required minlength="8"></div>
      <div class="field">
        <label>Rôle</label>
        <select id="a-role">
          <option value="admin">Admin</option>
          <option value="agent_paiement">Agent Paiement</option>
          <option value="support">Support</option>
          <option value="observateur">Observateur</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">Ajouter</button>
    </form>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="data-table"><thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Créé</th></tr></thead><tbody id="agents-tbody"><tr><td colspan="4">Chargement…</td></tr></tbody></table>
    </div>
  `;
  async function loadAgents(){
    const { data, error } = await sb.from('agents').select('*').order('created_at', { ascending:false });
    const tbody = document.getElementById('agents-tbody');
    if (error){ tbody.innerHTML = `<tr><td colspan="4">Erreur</td></tr>`; return; }
    tbody.innerHTML = (data||[]).map(a => `<tr><td>${a.name}</td><td>${a.email}</td><td>${a.role}</td><td>${new Date(a.created_at).toLocaleDateString()}</td></tr>`).join('') || `<tr><td colspan="4"><div class="empty-state">Aucun agent</div></td></tr>`;
  }
  document.getElementById('agent-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await apiFetch('admin?action=create-agent', { method:'POST', body:{
        name: document.getElementById('a-name').value.trim(),
        email: document.getElementById('a-email').value.trim(),
        password: document.getElementById('a-password').value,
        role: document.getElementById('a-role').value,
      }});
      toast('Agent créé', 'success');
      e.target.reset();
      loadAgents();
    } catch (err) { toast(err.message, 'error'); }
  });
  loadAgents();
}

/* --- Notifications --- */
function renderAdminNotifications(main){
  main.innerHTML = `<div class="card" style="padding:0;overflow-x:auto;">
    <table class="data-table"><thead><tr><th>Type</th><th>Message</th><th>Transfer ID</th><th>Montant</th><th>Expéditeur</th><th>Ordre</th><th>Date</th></tr></thead><tbody id="notif-tbody"><tr><td colspan="7">Chargement…</td></tr></tbody></table>
  </div>`;
  sb.from('waafi_notifications').select('*').order('created_at', { ascending:false }).limit(100).then(({ data, error }) => {
    const tbody = document.getElementById('notif-tbody');
    if (error){ tbody.innerHTML = `<tr><td colspan="7">Erreur</td></tr>`; return; }
    tbody.innerHTML = (data||[]).map(n => `<tr><td>${n.type}</td><td>${n.message||''}</td><td class="mono">${n.transfer_id||''}</td><td class="mono">${n.montant||''}</td><td class="mono">${n.sender_number||''}</td><td class="mono">${n.order_id||''}</td><td>${new Date(n.created_at).toLocaleString()}</td></tr>`).join('') || `<tr><td colspan="7"><div class="empty-state">Aucune notification</div></td></tr>`;
  });
}

/* --- Test Payment --- */
function renderAdminTestPay(main){
  main.innerHTML = `
    <div class="card" style="max-width:480px;">
      <div class="field"><label>User ID 1xBet</label><input type="text" id="tp-userid"></div>
      <div class="field"><label>Montant</label><input type="number" id="tp-amount" class="mono-input"></div>
      <div class="field"><label>Opération</label>
        <select id="tp-op"><option value="deposit">Deposit</option><option value="payout">Payout</option></select>
      </div>
      <div class="field"><label>Code de retrait 1xBet (payout uniquement)</label><input type="text" id="tp-code" class="mono-input"></div>
      <button class="btn btn-primary btn-block" id="tp-submit">Tester</button>
      <pre id="tp-result" class="mono" style="margin-top:14px;white-space:pre-wrap;font-size:.78rem;color:var(--text-dim);"></pre>
    </div>
  `;
  document.getElementById('tp-submit').addEventListener('click', async () => {
    const resultEl = document.getElementById('tp-result');
    resultEl.textContent = 'Envoi…';
    try {
      const res = await apiFetch('admin?action=test-payment', { method:'POST', body:{
        userId: document.getElementById('tp-userid').value.trim(),
        amount: Number(document.getElementById('tp-amount').value),
        operation: document.getElementById('tp-op').value,
        withdrawalCode: document.getElementById('tp-code').value.trim(),
      }});
      resultEl.textContent = JSON.stringify(res, null, 2);
    } catch (err) { resultEl.textContent = 'Erreur: ' + err.message; }
  });
}

/* ------------------------------ BOOT ------------------------------ */
async function boot(){
  checkCreatorBypass();
  document.documentElement.lang = currentLang;
  await refreshAuthState();
  route();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then((reg) => reg.update().catch(() => {})).catch(() => {});
  }
}
boot();
