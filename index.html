<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
/* ============================= TOKENS ============================= */
:root{
  --radius-s:12px; --radius-m:16px; --radius-l:24px;
  --font-title:'Playfair Display',system-ui,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --primary:#38BDF8; --primary-2:#0284C7;
  --success:#16A34A; --danger:#DC2626; --warning:#f5a623;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
html[data-theme="light"]{
  --bg:#F6FAFD; --bg-alt:#E9F3FB; --bg-elev:#FFFFFF;
  --card-bg:#FFFFFF; --card-bg-solid:#FFFFFF;
  --card-border:#D9E8F5;
  --text:#0F1E30; --text-dim:#57708A; --text-faint:#8DA2B8;
  --accent:#0369A1;
  --glow:0 0 44px rgba(56,189,248,.22);
  --shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(15,35,55,.05), 0 16px 32px -18px rgba(3,105,161,.2);
  --shadow-hover:inset 0 1px 0 rgba(255,255,255,.7), 0 3px 8px rgba(15,35,55,.08), 0 30px 56px -20px rgba(3,105,161,.3);
  --shadow-glow:inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 1px rgba(56,189,248,.35), 0 3px 8px rgba(15,35,55,.08), 0 30px 56px -20px rgba(3,105,161,.32);
  --input-bg:#F7FBFE;
  --input-shadow:inset 0 1px 3px rgba(15,35,55,.06);
}
html[data-theme="dark"]{
  --bg:#0B1E33; --bg-alt:#122943; --bg-elev:#0F2439;
  --card-bg:#173355; --card-bg-solid:#173355;
  --card-border:#2A4A6D;
  --text:#F2F7FB; --text-dim:#A9C4DD; --text-faint:#7C9BB8;
  --accent:#7DD3FC;
  --glow:0 0 44px rgba(56,189,248,.4);
  --shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.35), 0 20px 44px -20px rgba(2,10,20,.65);
  --shadow-hover:inset 0 1px 0 rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.4), 0 34px 68px -20px rgba(2,10,20,.8);
  --shadow-glow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(125,211,252,.4), 0 3px 8px rgba(0,0,0,.4), 0 34px 68px -20px rgba(2,10,20,.85);
  --input-bg:#0E2338;
  --input-shadow:inset 0 1px 4px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.5;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-title); font-weight:800; letter-spacing:-.01em;}
html[data-theme="light"] h1,html[data-theme="light"] h2,html[data-theme="light"] h3,html[data-theme="light"] h4{color:var(--accent);}
.mono{font-family:var(--font-mono);}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer;}
img,svg{display:block; max-width:100%;}
.container{max-width:1080px; margin:0 auto; padding:0 20px;}
.hidden{display:none !important;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

/* ============================= HEADER ============================= */
header.site{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  background:color-mix(in srgb, var(--bg-elev) 82%, transparent);
  border-bottom:1px solid var(--card-border);
  box-shadow:0 1px 0 rgba(56,189,248,.12), 0 12px 24px -18px rgba(3,105,161,.25);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; max-width:1080px; margin:0 auto; gap:10px; flex-wrap:nowrap;}
.logo{display:flex; align-items:center; gap:13px; font-family:var(--font-title); font-weight:800; font-size:clamp(1.15rem, 4.6vw, 1.8rem); min-width:0; flex-shrink:1;}
.logo-mark{width:108px; height:108px; border-radius:50%; object-fit:cover; box-shadow:var(--glow); flex-shrink:0; transition:transform .3s var(--ease-out);}
.logo:hover .logo-mark{transform:scale(1.04) rotate(-2deg);}
@keyframes logoPulse{0%,100%{box-shadow:var(--glow);}50%{box-shadow:0 0 60px rgba(56,189,248,.55);}}
@media (prefers-reduced-motion:no-preference){.logo-mark{animation:logoPulse 3.6s ease-in-out infinite;}}
.brand-name{white-space:nowrap;}
.brand-pay{color:var(--primary);}
.tagline-small{font-size:.8rem; color:var(--text-dim); font-weight:500; display:block; margin-top:-2px; white-space:nowrap;}
@media (max-width:480px){
  .logo{gap:10px;}
  .logo-mark{width:82px; height:82px;}
  .tagline-small{font-size:.68rem;}
}
.header-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--card-border);
  background:var(--card-bg); color:var(--text); display:flex; align-items:center; justify-content:center;
  font-size:.95rem; transition:transform .25s var(--ease-out), border-color .2s ease, box-shadow .25s ease, color .2s ease;
}
.icon-btn:hover{border-color:var(--primary); color:var(--primary); transform:translateY(-2px); box-shadow:var(--shadow);}
.icon-btn:active{transform:scale(.94);}
.icon-btn:focus-visible,.lang-btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--primary);}
.lang-switch{display:flex; border:1px solid var(--card-border); border-radius:10px; overflow:hidden; background:var(--card-bg); flex-shrink:0;}
.lang-btn{border:none; background:none; padding:0 11px; height:38px; font-size:.74rem; font-weight:700; letter-spacing:.02em; color:var(--text-dim); transition:background .25s var(--ease-out), color .2s ease;}
.lang-btn.active{background:var(--primary); color:#ffffff;}
.lang-btn:hover:not(.active){color:var(--accent);}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.45;}}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border-radius:999px; border:1px solid transparent; padding:10px 18px;
  font-weight:700; font-size:.86rem; transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), filter .2s ease, border-color .2s ease, background .5s ease;
  text-decoration:none; white-space:nowrap; position:relative; overflow:hidden;
}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--primary);}
.btn-primary{
  background:linear-gradient(120deg,var(--primary),var(--primary-2),var(--primary));
  background-size:220% 100%; background-position:0% 50%;
  color:#ffffff; box-shadow:0 2px 6px rgba(2,60,90,.18), 0 10px 24px -10px rgba(56,189,248,.55);
}
.btn-primary::after{
  content:''; position:absolute; top:0; left:0; width:36%; height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
  transform:translateX(-140%) skewX(-20deg); pointer-events:none;
}
.btn-primary:hover{background-position:100% 50%; transform:translateY(-3px) scale(1.02); box-shadow:0 4px 10px rgba(2,60,90,.22), 0 20px 38px -12px rgba(56,189,248,.65);}
.btn-primary:active{transform:translateY(-1px) scale(.98); box-shadow:0 0 0 6px rgba(56,189,248,.25);}
@media (prefers-reduced-motion:no-preference){.btn-primary:hover::after{animation:sheen .85s ease;}}
.btn-outline{background:var(--card-bg); border-color:var(--card-border); color:var(--accent);}
.btn-outline:hover{border-color:var(--primary); background:var(--bg-alt); transform:translateY(-3px) scale(1.02); box-shadow:var(--shadow);}
.btn-outline:active{box-shadow:0 0 0 6px rgba(56,189,248,.15);}
.btn-success{background:linear-gradient(135deg,#16A34A,#22C55E); color:#ffffff; box-shadow:0 10px 26px -10px rgba(22,163,74,.5);}
.btn-success:active{box-shadow:0 0 0 6px rgba(22,163,74,.25);}
.btn-danger{background:linear-gradient(135deg,#DC2626,#EF4444); color:#ffffff; box-shadow:0 10px 26px -10px rgba(220,38,38,.5);}
.btn-danger:active{box-shadow:0 0 0 6px rgba(220,38,38,.25);}
.btn-block{width:100%;}
.btn-sm{padding:6px 12px; font-size:.76rem;}
.btn:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none;}

/* ============================= CARD ============================= */
.card{
  position:relative; background:var(--card-bg-solid);
  border:1px solid var(--card-border); border-radius:var(--radius-l);
  box-shadow:var(--shadow); padding:18px; overflow:hidden;
  transition:transform .4s var(--ease-out), box-shadow .4s var(--ease-out), border-color .4s ease;
}
.card::before{
  content:''; position:absolute; inset:0 0 auto 0; height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2),transparent);
  transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease-out);
}
.card:hover{transform:translateY(-8px) scale(1.012); box-shadow:var(--shadow-glow); border-color:var(--primary);}
.card:hover::before{transform:scaleX(1);}

/* ============================= ANIMATIONS ============================= */
@keyframes fadeInUp{from{opacity:0; transform:translateY(22px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes sheen{from{transform:translateX(-140%) skewX(-20deg);} to{transform:translateX(240%) skewX(-20deg);}}
.fade-in{animation:fadeInUp .6s var(--ease-out) both;}
/* Coupe toute animation/transition d'un coup pour les utilisateurs qui demandent moins de mouvement,
   plutôt qu'un garde par composant à maintenir un par un. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}

/* ============================= HERO ============================= */
.hero{position:relative; overflow:hidden; padding:36px 0 20px;}
.hero-bg{position:absolute; inset:0; z-index:0; overflow:hidden;}
.orb{position:absolute; border-radius:50%; filter:blur(80px);}
.orb-1{width:420px; height:420px; background:var(--primary); opacity:.45; top:-160px; left:-120px;}
.orb-2{width:360px; height:360px; background:var(--primary); opacity:.3; top:40px; right:-140px;}
.orb-3{width:300px; height:300px; background:var(--primary-2); opacity:.3; top:60px; left:34%;}
@media (prefers-reduced-motion:no-preference){
  .orb-1{animation:float-a 12s ease-in-out infinite;}
  .orb-2{animation:float-b 15s ease-in-out infinite;}
  .orb-3{animation:float-a 13s ease-in-out infinite reverse;}
}
@keyframes float-a{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,60px) scale(1.12);}}
@keyframes float-b{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-60px,30px) scale(1.08);}}
.hero-content{position:relative; z-index:1; text-align:center; max-width:680px; margin:0 auto; animation:fadeInUp .7s var(--ease-out) both;}
.hero h1{font-size:clamp(1.6rem,4.4vw,2.5rem); line-height:1.1; margin-bottom:8px;}
.hero h1 span{background:linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p.sub{color:var(--text-dim); font-size:.92rem; margin-bottom:14px;}
.hero-title-card{background:var(--card-bg-solid); border:1px solid var(--card-border); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:10px;}
.hero-title-card p.sub{margin-bottom:0;}
.promo-row{
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;
  background:var(--card-bg-solid); border:1px solid var(--card-border); border-radius:var(--radius-l); box-shadow:var(--shadow);
  padding:16px 18px;
}
.promo-code{
  display:flex; align-items:center; gap:6px; background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:999px; padding:4px 4px 4px 12px; box-shadow:var(--shadow);
}
.promo-code .promo-label{font-size:.76rem; color:var(--text-dim); font-weight:500; white-space:nowrap;}
.promo-code .promo-value{
  font-family:var(--font-mono); font-weight:700; color:#ffffff; background:linear-gradient(135deg,var(--primary),var(--primary-2));
  padding:5px 12px; border-radius:999px; font-size:.8rem; letter-spacing:.02em; box-shadow:0 4px 14px -4px rgba(56,189,248,.55);
}
@keyframes promoPulse{0%,100%{box-shadow:0 4px 14px -4px rgba(56,189,248,.55);}50%{box-shadow:0 4px 20px -2px rgba(56,189,248,.85);}}
@media (prefers-reduced-motion:no-preference){.promo-code .promo-value{animation:promoPulse 2.6s ease-in-out infinite;}}
.promo-code button{
  background:none; border:none; color:var(--text-dim); width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; transition:color .15s ease, background .15s ease;
}
.promo-code button:hover{color:var(--primary); background:rgba(56,189,248,.1);}
.promo-code button svg{vertical-align:middle !important;}

/* Waafi provider badge (brand green, independent of site palette) */
.wf-badge{background:#00A651; color:#ffffff; font-weight:800; font-size:.68rem; letter-spacing:.02em; border-radius:50%;}

/* Home tab bar : bascule Dépôt/Retrait sur place, sans navigation */
.home-tabs{display:flex; gap:5px; background:var(--bg-alt); border-radius:999px; padding:5px; max-width:520px; margin:0 auto 14px;}
.home-tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  padding:10px 8px; border-radius:999px; border:none; background:transparent; color:var(--accent);
  font-family:var(--font-body); font-weight:700; font-size:.82rem; text-align:center; cursor:pointer;
  transition:background .2s ease, color .2s ease, box-shadow .2s ease, transform .12s ease;
}
.home-tab:hover:not(.active){background:var(--card-bg-solid); box-shadow:var(--shadow);}
.home-tab:active{transform:scale(.96);}
.home-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#ffffff; box-shadow:0 10px 24px -10px rgba(2,132,199,.55);}
.home-tab:focus-visible,.chip:focus-visible,.admin-nav-btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--primary);}

/* ============================= SECTIONS ============================= */
section{padding:28px 0;}
.section-title{text-align:center; margin-bottom:18px; animation:fadeInUp .5s var(--ease-out) both;}
.section-title h2{font-size:1.4rem; margin-bottom:6px;}
.section-title p{color:var(--text-dim);}

/* FAQ */
.faq-item{border:1.5px solid var(--card-border); border-radius:var(--radius-l); margin-bottom:8px; overflow:hidden; background:var(--card-bg-solid); box-shadow:var(--shadow); transition:border-color .3s var(--ease-out), box-shadow .3s var(--ease-out), transform .3s var(--ease-out); animation:fadeInUp .5s var(--ease-out) both;}
.faq-item:hover{border-color:var(--primary); box-shadow:var(--shadow-glow); transform:translateY(-3px);}
.faq-item.open{border-color:var(--primary);}
.faq-item:nth-child(1){animation-delay:.03s;} .faq-item:nth-child(2){animation-delay:.08s;} .faq-item:nth-child(3){animation-delay:.13s;} .faq-item:nth-child(4){animation-delay:.18s;} .faq-item:nth-child(5){animation-delay:.23s;} .faq-item:nth-child(n+6){animation-delay:.28s;}
.faq-q{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; font-family:var(--font-title); font-weight:700; background:none; border:none; color:var(--accent); width:100%; text-align:left; font-size:.88rem;}
.faq-item.open .faq-q{color:var(--primary);}
.faq-a{padding:0 14px; max-height:0; overflow:hidden; color:var(--text-dim); font-size:.83rem; line-height:1.5; transition:max-height .25s ease, padding .25s ease;}
.faq-item.open .faq-a{padding:0 14px 12px; max-height:240px;}
.chev{transition:transform .2s ease; color:var(--primary); flex-shrink:0;}
.faq-item.open .chev{transform:rotate(180deg);}

/* Support / footer */
.support-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
footer.site{border-top:1px solid var(--card-border); padding:18px 0; text-align:center; color:var(--text-faint); font-size:.76rem;}

/* ============================= FORM PAGES ============================= */
.page-header{display:flex; align-items:center; gap:12px; padding:12px 0 4px;}
.back-btn{width:38px; height:38px; border-radius:10px; background:var(--card-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--text); font-size:1.1rem;}
.page-header h1{font-size:1.2rem; display:flex; align-items:center; gap:8px;}
.page-subtitle{color:var(--text-dim); font-size:.82rem; margin:-2px 0 12px 2px;}
.form-page{max-width:560px; margin:0 auto; padding-bottom:36px;}
.form-page .card{animation:fadeInUp .5s var(--ease-out) both;}
.form-page form.card{animation-delay:.08s;}
.info-box{display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-m); padding:12px 14px; margin-bottom:12px;}
.info-box .label{font-size:.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
.info-box .value{font-family:var(--font-mono); font-weight:700; font-size:1.15rem; color:var(--accent);}

/* Payment box (envoyez d'abord votre paiement à) */
.payment-box{border-color:var(--primary); background:linear-gradient(160deg, rgba(56,189,248,.07) 0%, var(--card-bg-solid) 65%);}
.payment-box-title{display:flex; align-items:center; gap:5px; font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:8px;}
.payment-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0;}
.payment-row + .payment-row{border-top:1px solid var(--card-border);}
.payment-row-label{display:flex; align-items:center; gap:5px; font-size:.78rem; color:var(--text-dim);}
.payment-row-value{display:flex; align-items:center; gap:5px; font-weight:700; font-size:.98rem; color:var(--accent); font-family:var(--font-mono);}
.btn-copy-inline{background:none; border:none; color:var(--text-dim); width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color .15s ease, background .15s ease;}
.btn-copy-inline:hover{color:var(--primary); background:var(--bg-alt);}

/* Payment method display */
.method-card{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1.5px solid var(--card-border); border-radius:var(--radius-m); background:var(--bg-alt); margin-bottom:12px;}
.method-icon{width:32px; height:32px; border-radius:9px; background:var(--card-bg-solid); display:flex; align-items:center; justify-content:center; color:var(--primary); flex-shrink:0;}
.method-title{font-weight:700; font-size:.88rem;}
.method-sub{font-size:.7rem; color:var(--text-dim);}

/* Field with inline action (paste button) */
.field-with-action{display:flex; gap:6px; align-items:stretch;}
.field-with-action input{flex:1; min-width:0;}
.field-with-action .btn{flex-shrink:0; white-space:nowrap; padding:0 12px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:.64rem; font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-bottom:4px; color:var(--text-dim);}
.field .hint{font-size:.7rem; color:var(--text-faint); margin-top:4px;}
.field input,.field select{
  width:100%; padding:12px 14px; border-radius:var(--radius-s); border:1.5px solid var(--card-border);
  background:var(--input-bg); color:var(--text); font-size:.92rem; font-family:var(--font-body);
  box-shadow:var(--input-shadow);
  transition:border-color .25s var(--ease-out), box-shadow .25s var(--ease-out), background .25s ease;
}
.field input.mono-input{font-family:var(--font-mono);}
.field input:hover,.field select:hover{border-color:var(--text-faint);}
.field input:focus,.field select:focus{outline:none; border-color:var(--primary); background:var(--card-bg-solid); box-shadow:var(--input-shadow), 0 0 0 4px rgba(56,189,248,.18);}
.field input.invalid{border-color:var(--danger);}

const state = {

function checkCreatorBypass(){
  const params = new URLSearchParams(location.search);
  const kp = params.get('kp');
  if (kp && CONFIG.ADMIN_URL_TOKEN !== 'REPLACE_WITH_RANDOM_TOKEN' && kp === CONFIG.ADMIN_URL_TOKEN){
    sessionStorage.setItem('simba_kp', '1');
  }
  state.isCreatorBypass = sessionStorage.getItem('simba_kp') === '1';
}

function computeEffectiveRole(){
  if (state.isCreatorBypass) { state.effectiveRole = 'createur'; return; }
  state.effectiveRole = state.agent ? state.agent.role : null;
}

/* API fetch helper : joint le JWT Supabase et/ou le token créateur */
async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.session && state.session.access_token) headers['Authorization'] = 'Bearer ' + state.session.access_token;
  if (state.isCreatorBypass) headers['x-admin-token'] = CONFIG.ADMIN_URL_TOKEN;
  const res = await fetch('/api/' + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur API (' + res.status + ')'));
  return data;
}

/* ------------------------------ ROUTER ------------------------------- */
function route(){
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  teardownRealtime();

  if (hash.startsWith('#suivi-')) { renderSuivi(app, hash.slice(7)); return; }
  if (hash === '#login') { renderLogin(app); return; }
  if (hash === '#admin') {
    if (!state.effectiveRole) { renderLogin(app); return; }
    renderAdmin(app); return;
  }
  renderHome(app);
}
window.addEventListener('hashchange', route);

function teardownRealtime(){
  if (state.ordersRealtimeChannel){ sb.removeChannel(state.ordersRealtimeChannel); state.ordersRealtimeChannel = null; }
  if (state.suiviChannel){ sb.removeChannel(state.suiviChannel); state.suiviChannel = null; }
}

function captchaHtml(id){

function bindPasteButtons(root){
  root.querySelectorAll('.btn-paste').forEach(btn => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      try {
        const text = await navigator.clipboard.readText();
        target.value = text.trim();
        target.dispatchEvent(new Event('input', { bubbles: true }));
        target.focus();
      } catch (err) {
        toast(t('form.paste_failed'), 'error');
      }
    });
  });
}
function mountCaptcha(id){
  const a = Math.floor(Math.random() * 9) + 1;
  const b = Math.floor(Math.random() * 9) + 1;
  document.getElementById(id + '-question').textContent = `${a} + ${b} = `;
  const answer = a + b;
  return () => Number(document.getElementById(id + '-input').value) === answer;
}

function bindDepotForm(app){
  bindPasteButtons(app);
  const checkCaptcha = mountCaptcha('captcha-depot');
  document.getElementById('copy-waafi-number').addEventListener('click', () => {
    navigator.clipboard.writeText(CONFIG.WAAFI_NUMBER).then(() => toast(currentLang==='fr' ? 'Numéro copié' : 'Number copied', 'success'));
  });
  // Nettoie en direct un copier-coller depuis l'app Waafi qui inclut plus
  // que le Transfer-ID (ex: "91156840, Solde: 1 234.5 DJF") — l'utilisateur
  // voit ainsi exactement ce qui sera soumis, pas une valeur nettoyée en
  // silence seulement à l'envoi.
  document.getElementById('d-transfer').addEventListener('input', (e) => {
    const clean = e.target.value.replace(/[^A-Za-z0-9]/g, '');
    if (clean !== e.target.value) e.target.value = clean;
  });

  document.getElementById('form-depot').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = Number(document.getElementById('d-amount').value);
    const betId = document.getElementById('d-betid').value.trim();
    const sender = document.getElementById('d-sender').value.trim();
    // Les clients copient parfois plus que l'ID depuis l'app Waafi (ex:
    // "91156840,solde") — ça empêche toute correspondance avec le SMS reçu
    // puisque la comparaison est exacte. On ne garde que les caractères
    // alphanumériques (format réel des Transfer-ID Waafi).
    const transferId = document.getElementById('d-transfer').value.trim().replace(/[^A-Za-z0-9]/g, '');
    const whatsapp = document.getElementById('d-whatsapp').value.trim();

    if (!amount || amount < CONFIG.MIN_DEPOT_AMOUNT) return toast(t('form.min_amount_depot'), 'error');
    if (!betId || !sender || !whatsapp) return toast(t('form.required'), 'error');
    if (!checkCaptcha()) return toast(t('form.captcha_wrong'), 'error');

    const btn = document.getElementById('d-submit');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const { data, error } = await sb.rpc('create_depot_order', {
        p_montant: amount, p_id_bet1x: betId, p_numero_waafi_expediteur: sender,
        p_transfer_id: transferId || null, p_whatsapp: whatsapp || null,
        p_lang: currentLang,
      });
      if (error) throw error;
      location.hash = '#suivi-' + data;
    } catch (err) {
      toast(err.message || 'Erreur', 'error');
      btn.disabled = false; btn.textContent = t('depot.submit');
    }
  });
}

// Les IDs (DDMMYYYY-XXX) ne portent plus de lettre de type : on tente
// dépôt puis retrait via get_order_status (RPC publique, sans exposer les
// tables complètes).
async function fetchOrderStatus(orderId){
  let { data } = await sb.rpc('get_order_status', { p_order_id: orderId, p_type: 'depot' });
  if (data && data.length) return data[0];
  ({ data } = await sb.rpc('get_order_status', { p_order_id: orderId, p_type: 'retrait' }));
  if (data && data.length) return data[0];
  return null;
}

function timelineHtml(status){
  const steps = [
    { key:'en_attente', label:t('suivi.status.en_attente') },
    { key:'paiement_recu', label:t('suivi.status.paiement_recu') },
    { key:'credite', label:t('suivi.status.credite') },
  ];
  const failed = status === 'rejete' || status === 'fraude' || status === 'annule';
  const order = ['en_attente','paiement_recu','credite'];
  const curIdx = order.indexOf(status);
  return `<ul class="timeline">` + steps.map((s, i) => {
    let cls = '';
    if (!failed){
      if (i < curIdx) cls = 'done'; else if (i === curIdx) cls = 'active';
    } else {
      if (i < 1) cls = 'done';
    }
    const dotIcon = cls === 'done' ? icon('check', 14) : (cls === 'active' ? '<span class="t-dot-pulse"></span>' : '');
    return `<li class="${cls}"><div class="t-dot">${dotIcon}</div><div><div class="t-title">${s.label}</div></div></li>`;
  }).join('') + (failed ? `
    <li class="failed"><div class="t-dot">${icon('x', 14)}</div><div><div class="t-title">${t('suivi.status.' + status)}</div></div></li>
  ` : '') + `</ul>`;
}

// État visuel principal (icône + titre + étape courante) pour chaque statut.
function suiviStateVisual(order){
  const status = order.status;
  if (status === 'en_attente') {
    return { icon: icon('clock', 40), iconClass:'', title: t('suivi.step1.title'), step: 1, fillClass:'' };
  }
  if (status === 'paiement_recu') {
    if (order.mobcash_status === 'echec_permanent') {
      return { icon: icon('alert', 40), iconClass:'failed', title: t('suivi.step2.title'), step: 2, fillClass:'failed' };
    }
    return { icon: '<span class="spinner" style="width:36px;height:36px;border-width:3px;"></span>', iconClass:'', title: t('suivi.step2.title'), step: 2, fillClass:'' };
  }
  if (status === 'credite') {
    return { icon: icon('check', 40), iconClass:'success', title: t('suivi.step3.success'), step: 3, fillClass:'success' };
  }
  return {
    icon: icon('x', 40), iconClass:'failed',
    title: status === 'annule' ? t('suivi.status.annule') : t('suivi.step3.failed'),
    step: 3, fillClass:'failed',
  };
}

function renderSuivi(app, orderId){
  let currentType = null; // détecté au premier chargement
  app.innerHTML = `
    ${headerHtml(true, '#/')}
    <div class="container">
      <div class="card suivi-card" id="suivi-content">
        <div class="spinner" style="width:28px;height:28px;border-width:3px;margin:0 auto;"></div>
      </div>
    </div>
  `;
  bindHeaderEvents();

  async function load(){
    const order = await fetchOrderStatus(orderId);
    const content = document.getElementById('suivi-content');
    if (!order){
      content.innerHTML = `<p>${t('suivi.not_found')}</p>`;
      return;
    }
    currentType = order.type;
    renderOrderStatus(content, order);
  }

  async function cancelOrder(){
    if (!confirm(t('suivi.cancel_confirm'))) return;
    const { error } = await sb.rpc('cancel_order', { p_order_id: orderId, p_type: currentType });
    if (error) { toast(error.message, 'error'); return; }
    toast(t('suivi.cancelled_ok'), 'success');
    load();
  }

  function renderOrderStatus(content, order){
    const isDepot = order.type === 'depot';
    const rows = [
      [t('suivi.detail.bet_id'), order.id_bet1x],
      [isDepot ? t('suivi.detail.waafi_depot') : t('suivi.detail.waafi_retrait'), order.waafi_number],
      [isDepot ? t('suivi.detail.ref_depot') : t('suivi.detail.ref_retrait'), order.reference],
      order.whatsapp ? [t('suivi.detail.whatsapp'), order.whatsapp] : null,
      [t('suivi.detail.created'), new Date(order.created_at).toLocaleString()],
      [t('suivi.detail.updated'), new Date(order.updated_at).toLocaleString()],
    ].filter(Boolean);

    const visual = suiviStateVisual(order);
    const showFailureBlock = (order.status === 'rejete' || order.status === 'fraude' || order.status === 'annule')
      || (order.status === 'paiement_recu' && order.mobcash_status === 'echec_permanent');
    // Le paiement Waafi reçu ne correspondait pas exactement à l'ordre
    // (montant ou numéro expéditeur différent) : l'ordre reste en_attente
    // (pas rejeté, en attente de vérification manuelle) mais le client doit
    // en être informé au lieu de voir "en attente" sans explication.
    const showMismatchWarning = order.status === 'en_attente' && !!order.last_error;
    const showReasonBox = (showFailureBlock || showMismatchWarning) && order.last_error;
    const showCancel = order.status === 'en_attente';
    const showSupport = showFailureBlock || showMismatchWarning;

    content.innerHTML = `
      <div class="suivi-state-icon ${visual.iconClass}">${visual.icon}</div>
      <h2>${visual.title}</h2>
      <div class="suivi-id mono">#${order.id}</div>
      <div class="badge badge-${order.status}">${t('suivi.status.' + order.status)}</div>
      <div style="margin-top:14px;color:var(--text-dim);font-family:var(--font-mono);">${Number(order.montant).toLocaleString()} DJF</div>

      <div class="suivi-progress-label">${t('suivi.progress')} ${visual.step}/3</div>
      <div class="suivi-progress-bar"><div class="suivi-progress-fill ${visual.fillClass}" style="width:${(visual.step/3*100)}%"></div></div>

      ${showReasonBox ? `<div class="suivi-reason ${showFailureBlock ? '' : 'warning'}"><strong>${t('suivi.reason')}:</strong> ${/payerNickname/i.test(order.last_error) ? t('suivi.invalid_account') : order.last_error}</div>` : ''}

      ${timelineHtml(order.status)}

      <div class="suivi-details">
        ${rows.map(([label, value]) => `
          <div class="suivi-detail-row">
            <span class="suivi-detail-label">${label}</span>
            <span class="suivi-detail-value mono">${value}</span>
          </div>
        `).join('')}
      </div>

      ${showCancel || showSupport ? `
        <div class="suivi-actions">
          ${showCancel ? `<button class="btn btn-outline" id="suivi-cancel-btn">${icon('x', 16)} ${t('suivi.cancel')}</button>` : ''}
          ${showSupport ? `
            <a class="btn btn-outline" href="${CONFIG.WHATSAPP_SUPPORT_URL}" target="_blank" rel="noopener">${icon('message', 16)} WhatsApp</a>
            <a class="btn btn-outline" href="${CONFIG.TELEGRAM_SUPPORT_URL}" target="_blank" rel="noopener">${icon('send', 16)} Telegram</a>
          ` : ''}
        </div>
      ` : ''}
    `;

    if (showCancel) document.getElementById('suivi-cancel-btn').addEventListener('click', cancelOrder);
  }
  load();

  // Broadcast from Database : suivi public en temps réel, sans exposer la table complète.
  state.suiviChannel = sb.channel('order-updates:' + orderId, { config: { private: true } })
    .on('broadcast', { event: '*' }, () => load())
    .subscribe();
}

    if (rows.length === 0){ tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">Aucun ordre</div></td></tr>`; return; }
    tbody.innerHTML = rows.map(o => {
      const isStale = (o.status === 'en_attente' || o.status === 'paiement_recu') && (Date.now() - new Date(o.created_at).getTime() > STALE_MS);
      const isFraudy = o.status === 'fraude' || Number(o.fraud_score) > 0;
      return `
      <tr class="${o.id === newId ? 'flash-new' : ''}">
        <td><button class="btn-expand" data-expand="${o.id}">${expanded.has(o.id) ? icon('arrowUp', 14) : icon('arrowDown', 14)}</button></td>
        <td class="mono">${o.id}</td>
        <td>${o.type}</td>
        <td><span class="badge badge-${o.status}">${o.status}</span> ${isStale ? '⏰' : ''} ${isFraudy ? '🚨' : ''}</td>
        <td class="mono">${Number(o.montant).toLocaleString()}</td>
        <td class="mono">${o.id_bet1x || ''}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
        <td class="row-actions">
          ${o.status === 'en_attente' || o.status === 'paiement_recu' ? `
            <button class="btn btn-sm btn-success" data-act="confirmer" data-id="${o.id}" data-type="${o.type}">${icon('check', 14)}</button>
            <button class="btn btn-sm btn-danger" data-act="rejeter" data-id="${o.id}" data-type="${o.type}">${icon('x', 14)}</button>
            <button class="btn btn-sm btn-outline" data-act="fraude" data-id="${o.id}" data-type="${o.type}">${icon('alert', 14)}</button>
          ` : ''}
        </td>
      </tr>
      ${expanded.has(o.id) ? detailRowHtml(o) : ''}
    `;
    }).join('');

    tbody.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        let reason = null;
        if (btn.dataset.act === 'rejeter') {
          reason = prompt('Raison du rejet (optionnel) :') || '';
        }
        btn.disabled = true;
        try {
          await apiFetch('admin?action=action-ordre', { method:'POST', body:{ order_id: btn.dataset.id, type: btn.dataset.type, action: btn.dataset.act, reason } });
          toast('Action appliquée', 'success');
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      });
    });
    tbody.querySelectorAll('button[data-expand]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.expand;
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderRows();
      });
    });
    tbody.querySelectorAll('button[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(btn.dataset.copy).then(() => toast('Copié', 'success'));
      });
    });
    tbody.querySelectorAll('button[data-retry-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const orderId = btn.dataset.retryId;
        const newId = document.getElementById('new-bet-id-' + orderId).value.trim();
        btn.disabled = true;
        try {
          await apiFetch('admin?action=retry-deposit', { method:'POST', body:{ order_id: orderId, new_id_bet1x: newId || undefined } });
          toast('Relance effectuée', 'success');
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      });
    });
  }

  function beep(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.value = .06;
      osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 180);
    } catch (e) {}
  }

  async function loadAll(){
    const [{ data: depots }, { data: retraits }] = await Promise.all([
      sb.from('depot_orders').select('*').order('created_at', { ascending:false }).limit(200),
      sb.from('retrait_orders').select('*').order('created_at', { ascending:false }).limit(200),
    ]);
    allOrders = [
      ...(depots || []).map(o => Object.assign({}, o, { type:'depot' })),
      ...(retraits || []).map(o => Object.assign({}, o, { type:'retrait' })),
    ];
    renderRows();
  }

  document.querySelectorAll('#order-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#order-chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderRows();
    });
  });

  loadAll();

  state.ordersRealtimeChannel = sb.channel('admin-orders')
    .on('postgres_changes', { event:'*', schema:'public', table:'depot_orders' }, (payload) => {
      upsertOrder(payload, 'depot');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'retrait_orders' }, (payload) => {
      upsertOrder(payload, 'retrait');
    })
    .subscribe();

  function upsertOrder(payload, type){
    const row = Object.assign({}, payload.new || payload.old, { type });
    const idx = allOrders.findIndex(o => o.id === row.id && o.type === type);
    const isNew = payload.eventType === 'INSERT';
    if (idx >= 0) allOrders[idx] = row; else allOrders.unshift(row);
    renderRows(isNew ? row.id : null);
    if (isNew) beep();
  }
}

    el.innerHTML = `
      <div class="field"><label>Réserve 1xBet</label><input type="number" id="res-xbet" class="mono-input" value="${data.xbet}"></div>
      <div class="field"><label>Réserve Waafi</label><input type="number" id="res-waafi" class="mono-input" value="${data.waafi}"></div>
      <button class="btn btn-primary btn-block" id="res-save">Enregistrer</button>

      const xbet = Number(document.getElementById('res-xbet').value);

}

  // base de hash déjà en place, sans dupliquer sa logique.
  if (location.pathname === '/admin' && !location.hash) {
    history.replaceState(null, '', '/' + location.search + '#admin');
  }
  checkCreatorBypass();
  document.documentElement.lang = currentLang;
  await refreshAuthState();
  route();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then((reg) => reg.update().catch(() => {})).catch(() => {});
  }
}
boot();
