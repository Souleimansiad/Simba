.logo-mark{width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--primary),#7CC4FF); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; box-shadow:var(--glow);}
.tagline-small{font-size:.72rem; color:var(--text-dim); font-weight:500; display:block; margin-top:-2px;}
.header-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{

}

/* ============================= BUTTONS ============================= */
.btn{

}
.btn:active{transform:scale(.97);}

.btn-outline{background:var(--card-bg); border-color:var(--card-border); color:var(--text);}

.btn-success{background:linear-gradient(135deg,#22C55E,#4ADE80); color:#06210F; box-shadow:0 10px 26px -10px rgba(34,197,94,.5);}
.btn-danger{background:linear-gradient(135deg,#EF4444,#F87171); color:#2A0808; box-shadow:0 10px 26px -10px rgba(239,68,68,.5);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px; font-size:.8rem;}
.btn:disabled{opacity:.5; cursor:not-allowed; filter:none; transform:none;}

/* ============================= GLASS CARD ============================= */
.card{

}

.form-inline .field{margin-bottom:0; min-width:160px; flex:1;}

/* Toasts */

.toast.info{border-color:var(--primary); color:var(--primary-2);}

}
@keyframes toast-in{from{transform:translateX(20px); opacity:0;}to{transform:translateX(0); opacity:1;}}

.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; display:inline-block;}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin .7s linear infinite;}}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

/* ------------------------------ TOASTS ------------------------------ */
function toast(message, type){
  type = type || 'info';
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = message;
  root.appendChild(el);

}

function checkCreatorBypass(){
  const params = new URLSearchParams(location.search);
  const kp = params.get('kp');
  if (kp && CONFIG.ADMIN_URL_TOKEN !== 'REPLACE_WITH_RANDOM_TOKEN' && kp === CONFIG.ADMIN_URL_TOKEN){
    sessionStorage.setItem('simba_kp', '1');
  }
  state.isCreatorBypass = sessionStorage.getItem('simba_kp') === '1';
}

function computeEffectiveRole(){
  if (state.isCreatorBypass) { state.effectiveRole = 'createur'; return; }
  state.effectiveRole = state.agent ? state.agent.role : null;
}

/* API fetch helper : joint le JWT Supabase et/ou le token créateur */
async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.session && state.session.access_token) headers['Authorization'] = 'Bearer ' + state.session.access_token;
  if (state.isCreatorBypass) headers['x-admin-token'] = CONFIG.ADMIN_URL_TOKEN;
  const res = await fetch('/api/' + path, {
    method: options.method || 'GET',
    headers,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Erreur API (' + res.status + ')'));
  return data;
}

/* ------------------------------ ROUTER ------------------------------- */
function route(){
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  teardownRealtime();

  if (hash.startsWith('#suivi-')) { renderSuivi(app, hash.slice(7)); return; }
  if (hash === '#depot') { renderDepot(app); return; }
  if (hash === '#retrait') { renderRetrait(app); return; }
  if (hash === '#login') { renderLogin(app); return; }
  if (hash === '#admin') {
    if (!state.effectiveRole) { renderLogin(app); return; }
    renderAdmin(app); return;
  }
  renderHome(app);
}
window.addEventListener('hashchange', route);

function teardownRealtime(){
  if (state.ordersRealtimeChannel){ sb.removeChannel(state.ordersRealtimeChannel); state.ordersRealtimeChannel = null; }
  if (state.suiviChannel){ sb.removeChannel(state.suiviChannel); state.suiviChannel = null; }
}

/* ------------------------------ TURNSTILE HELPER ----------------------- */
function renderTurnstile(containerId, onToken){
  const el = document.getElementById(containerId);
  if (!el) return;
  function tryRender(retries){
    if (window.turnstile && typeof window.turnstile.render === 'function'){
      window.turnstile.render('#' + containerId, {
        sitekey: CONFIG.TURNSTILE_SITE_KEY,
        callback: onToken,
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light',
      });
    } else if (retries > 0){
      setTimeout(() => tryRender(retries - 1), 300);
    }
  }
  tryRender(20);
}

function orderType(id){ return id.startsWith('R') ? 'retrait' : 'depot'; }

function timelineHtml(status){
  const steps = [
    { key:'en_attente', label:t('suivi.status.en_attente') },
    { key:'paiement_recu', label:t('suivi.status.paiement_recu') },
    { key:'credite', label:t('suivi.status.credite') },
  ];
  const failed = status === 'rejete' || status === 'fraude';
  const order = ['en_attente','paiement_recu','credite'];
  const curIdx = order.indexOf(status);
  return `<ul class="timeline">` + steps.map((s, i) => {
    let cls = '';
    if (failed && i === order.length - 1) { /* last step becomes failure marker below */ }
    if (!failed){
      if (i < curIdx) cls = 'done'; else if (i === curIdx) cls = 'active';
    } else {
      if (i < 1) cls = 'done';
    }
    const icon = cls === 'done' ? '✓' : (cls === 'active' ? '●' : '');
    return `<li class="${cls}"><div class="t-dot">${icon}</div><div><div class="t-title">${s.label}</div></div></li>`;
  }).join('') + (failed ? `
    <li class="failed"><div class="t-dot">✕</div><div><div class="t-title">${t('suivi.status.' + status)}</div></div></li>
  ` : '') + `</ul>`;
}

/* ------------------------------ AUTH STATE ------------------------------ */
async function refreshAuthState(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if (session && session.user){
    const { data: agentRow } = await sb.from('agents').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
    state.agent = agentRow || null;
  } else {
    state.agent = null;
  }
  computeEffectiveRole();
}
sb.auth.onAuthStateChange(async (_event, session) => {
  state.session = session;
  if (session && session.user){
    const { data: agentRow } = await sb.from('agents').select('id,name,email,role').eq('id', session.user.id).maybeSingle();
    state.agent = agentRow || null;
  } else {
    state.agent = null;
  }
  computeEffectiveRole();
});

/* ------------------------------ ADMIN PANEL ------------------------------ */
const ADMIN_TABS = [
  { key:'dashboard', icon:'📊', roles:['createur','admin','agent_paiement','support','observateur'] },
  { key:'orders', icon:'🧾', roles:['createur','admin','agent_paiement','support','observateur'] },

  { key:'testpay', icon:'🧪', roles:['createur','admin'] },
];

function renderAdmin(app){
  const visibleTabs = ADMIN_TABS.filter(tab => tab.roles.includes(state.effectiveRole));
  if (!visibleTabs.find(t2 => t2.key === state.adminTab)) state.adminTab = visibleTabs[0].key;

  app.innerHTML = `
    ${headerHtml(true, '#/')}
    <div class="admin-shell">
      <aside class="admin-side">
        ${visibleTabs.map(tabDef => `
          <button class="admin-nav-btn ${state.adminTab === tabDef.key ? 'active' : ''}" data-tab="${tabDef.key}">
            ${tabDef.icon} ${t('admin.' + tabDef.key)}
          </button>
        `).join('')}

      <main class="admin-main" id="admin-main"></main>
    </div>
  `;

    btn.addEventListener('click', () => { state.adminTab = btn.dataset.tab; renderAdmin(app); });
  });

    await sb.auth.signOut();

    state.isCreatorBypass = false; state.agent = null; state.effectiveRole = null;
    location.hash = '#/';
  });

  const main = document.getElementById('admin-main');

  else if (state.adminTab === 'reserves') renderAdminReserves(main);

  else if (state.adminTab === 'notifications') renderAdminNotifications(main);

}

/* --- Orders --- */
function renderAdminOrders(main){
  main.innerHTML = `
    <div class="filter-chips" id="order-chips">
      ${['tous','en_attente','depots','retraits','credite','rejete','fraude'].map(f => `<button class="chip ${f==='tous'?'active':''}" data-filter="${f}">${f}</button>`).join('')}
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="data-table" id="orders-table">
        <thead><tr><th>ID</th><th>Type</th><th>Statut</th><th>Montant</th><th>ID 1xBet</th><th>Créé</th><th></th></tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  `;
  if (!state.session){
    document.getElementById('orders-tbody').innerHTML = `<tr><td colspan="7"><div class="empty-state">Connectez-vous avec un compte Supabase Auth pour voir les ordres en temps réel.</div></td></tr>`;
    return;
  }

  let allOrders = [];
  let currentFilter = 'tous';

  function passesFilter(o){
    if (currentFilter === 'tous') return true;
    if (currentFilter === 'depots') return o.type === 'depot';
    if (currentFilter === 'retraits') return o.type === 'retrait';
    return o.status === currentFilter;
  }

  function renderRows(newId){
    const tbody = document.getElementById('orders-tbody');
    const rows = allOrders.filter(passesFilter).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    if (rows.length === 0){ tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">Aucun ordre</div></td></tr>`; return; }
    tbody.innerHTML = rows.map(o => `
      <tr class="${o.id === newId ? 'flash-new' : ''}">
        <td class="mono">${o.id}</td>
        <td>${o.type}</td>
        <td><span class="badge badge-${o.status}">${o.status}</span></td>
        <td class="mono">${Number(o.montant).toLocaleString()}</td>
        <td class="mono">${o.id_bet1x || ''}</td>
        <td>${new Date(o.created_at).toLocaleString()}</td>
        <td class="row-actions">
          ${o.status === 'en_attente' || o.status === 'paiement_recu' ? `
            <button class="btn btn-sm btn-success" data-act="confirmer" data-id="${o.id}" data-type="${o.type}">✓</button>
            <button class="btn btn-sm btn-danger" data-act="rejeter" data-id="${o.id}" data-type="${o.type}">✕</button>
            <button class="btn btn-sm btn-outline" data-act="fraude" data-id="${o.id}" data-type="${o.type}">⚠</button>
          ` : ''}
        </td>
      </tr>
    `).join('');
    tbody.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await apiFetch('admin-action-ordre', { method:'POST', body:{ order_id: btn.dataset.id, type: btn.dataset.type, action: btn.dataset.act } });
          toast('Action appliquée', 'success');
        } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
      });
    });
  }

  function beep(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.value = .06;
      osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 180);
    } catch (e) {}
  }

  async function loadAll(){
    const [{ data: depots }, { data: retraits }] = await Promise.all([
      sb.from('depot_orders').select('*').order('created_at', { ascending:false }).limit(200),
      sb.from('retrait_orders').select('*').order('created_at', { ascending:false }).limit(200),
    ]);
    allOrders = [
      ...(depots || []).map(o => Object.assign({}, o, { type:'depot' })),
      ...(retraits || []).map(o => Object.assign({}, o, { type:'retrait' })),
    ];
    renderRows();
  }

  document.querySelectorAll('#order-chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#order-chips .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      renderRows();
    });
  });

  loadAll();

  state.ordersRealtimeChannel = sb.channel('admin-orders')
    .on('postgres_changes', { event:'*', schema:'public', table:'depot_orders' }, (payload) => {
      upsertOrder(payload, 'depot');
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'retrait_orders' }, (payload) => {
      upsertOrder(payload, 'retrait');
    })
    .subscribe();

  function upsertOrder(payload, type){
    const row = Object.assign({}, payload.new || payload.old, { type });
    const idx = allOrders.findIndex(o => o.id === row.id && o.type === type);
    const isNew = payload.eventType === 'INSERT';
    if (idx >= 0) allOrders[idx] = row; else allOrders.unshift(row);
    renderRows(isNew ? row.id : null);
    if (isNew) beep();
  }
}
